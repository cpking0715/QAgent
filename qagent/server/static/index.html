<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>QAgent</title>
  <style>
    :root {
      --bg: #f4f5f7;
      --surface: #fff;
      --text: #1f2329;
      --muted: #646a73;
      --line: #e8eaed;
      --hover: #f2f3f5;
      --accent: #3370ff;
      --accent-soft: #e8f0ff;
      --user-bg: #dce8ff;
      --ok: #00b42a;
      --warn: #ff7d00;
      --err: #f53f3f;
      --shadow: 0 8px 28px rgba(31, 35, 41, .08);
      --radius: 18px;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      color: var(--text);
      background: var(--bg);
      font: 15px/1.55 "PingFang SC", "Noto Sans SC", "HarmonyOS Sans SC", -apple-system, sans-serif;
    }
    button, input, textarea, select { font: inherit; }
    button { cursor: pointer; }
    a { color: var(--accent); text-decoration: none; }
    .app { display: flex; height: 100%; }
    .sidebar {
      width: 260px; flex-shrink: 0;
      background: var(--surface);
      border-right: 1px solid var(--line);
      display: flex; flex-direction: column;
    }
    .brand { display: flex; align-items: center; gap: 10px; padding: 18px 16px 8px; }
    .logo {
      width: 32px; height: 32px; border-radius: 10px;
      background: linear-gradient(135deg, #5b8cff, #3370ff 55%, #7c5cff);
      color: #fff; display: grid; place-items: center;
      font-weight: 700; font-size: 13px; letter-spacing: -.02em;
    }
    .brand strong { font-size: 16px; }
    .brand span { display: block; color: var(--muted); font-size: 12px; font-weight: 400; }
    .new-chat {
      margin: 12px 12px 8px;
      height: 40px; border: 1px solid var(--line); border-radius: 12px;
      background: var(--surface); color: var(--text); font-weight: 560;
      display: flex; align-items: center; justify-content: center; gap: 8px;
    }
    .new-chat:hover { background: var(--hover); }
    .hist { flex: 1; overflow: auto; padding: 4px 8px 12px; }
    .hist h4 { margin: 12px 8px 6px; color: var(--muted); font-size: 12px; font-weight: 500; }
    .job {
      padding: 8px 8px 8px 12px; border-radius: 12px; cursor: pointer;
      display: flex; align-items: center; gap: 6px;
    }
    .job .body { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
    .job:hover { background: var(--hover); }
    .job.active { background: var(--accent-soft); }
    .job .t { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .job small { color: var(--muted); font-size: 12px; }
    .job .del {
      flex-shrink: 0; width: 28px; height: 28px; border: 0; border-radius: 8px;
      background: transparent; color: var(--muted); opacity: 0; font-size: 16px; line-height: 1;
    }
    .job:hover .del { opacity: 1; }
    .job .del:hover { background: #fee; color: var(--err); }
    .side-foot { padding: 12px; border-top: 1px solid var(--line); }
    .ghost {
      width: 100%; height: 36px; border: 0; border-radius: 10px;
      background: transparent; color: var(--muted); text-align: left; padding: 0 8px;
    }
    .ghost:hover { background: var(--hover); color: var(--text); }
    .stage {
      flex: 1; min-width: 0; display: flex; flex-direction: column;
      position: relative;
    }
    .thread-bar {
      height: 56px; display: flex; align-items: center; justify-content: space-between;
      padding: 0 24px; border-bottom: 1px solid transparent;
    }
    .thread-bar .meta { color: var(--muted); font-size: 13px; }
    .actions { display: flex; gap: 8px; }
    .chip-btn {
      height: 32px; padding: 0 12px; border-radius: 999px;
      border: 1px solid var(--line); background: var(--surface); color: var(--text);
    }
    .chip-btn:hover { background: var(--hover); }
    .chip-btn:disabled { opacity: .45; cursor: not-allowed; }
    .msgs {
      flex: 1; overflow: auto; padding: 8px 0 16px;
    }
    .welcome {
      max-width: 720px; margin: 8vh auto 0; text-align: center; padding: 0 24px;
    }
    .welcome h1 { font-size: 32px; font-weight: 640; letter-spacing: -.03em; margin: 0 0 10px; }
    .welcome p { color: var(--muted); margin: 0 0 28px; }
    .suggest { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; }
    .suggest button {
      border: 1px solid var(--line); background: var(--surface);
      border-radius: 999px; padding: 10px 16px; color: var(--text);
      box-shadow: 0 1px 2px rgba(31,35,41,.04);
    }
    .suggest button:hover { border-color: #c9d4ff; background: var(--accent-soft); }
    .row { max-width: 760px; margin: 0 auto; padding: 6px 24px; display: flex; gap: 12px; }
    .row.user { justify-content: flex-end; }
    .avatar {
      width: 32px; height: 32px; border-radius: 10px; flex-shrink: 0;
      background: linear-gradient(135deg, #5b8cff, #7c5cff);
      color: #fff; display: grid; place-items: center; font-size: 11px; font-weight: 700;
    }
    .bubble {
      max-width: min(640px, calc(100% - 44px));
      padding: 12px 16px; border-radius: 16px; white-space: pre-wrap; word-break: break-word;
    }
    .row.assistant .bubble { background: var(--surface); box-shadow: 0 1px 2px rgba(31,35,41,.04); }
    .row.user .bubble { background: var(--user-bg); border-bottom-right-radius: 6px; }
    .files { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; }
    .file-card, .art-card {
      display: flex; align-items: center; gap: 8px;
      padding: 8px 10px; border: 1px solid var(--line); border-radius: 12px;
      background: var(--surface); font-size: 13px;
    }
    .file-ico {
      width: 28px; height: 28px; border-radius: 8px;
      background: #fff3e8; color: #d25f00;
      display: grid; place-items: center; font-size: 11px; font-weight: 700;
    }
    .status-card {
      background: var(--surface); border-radius: 16px; padding: 14px 16px;
      box-shadow: 0 1px 2px rgba(31,35,41,.04); min-width: 280px; width: min(560px, 100%);
      white-space: normal;
    }
    .deliverables { margin-top: 12px; display: flex; flex-direction: column; gap: 8px; }
    .deliv {
      border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px;
      background: #fafbfc; cursor: pointer;
    }
    .deliv:hover { border-color: #c9d4ff; background: #f6f9ff; }
    .deliv .open-editor { height: 24px; padding: 0 8px; font-size: 12px; flex-shrink: 0; }
    .deliv-head { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; }
    .deliv-head strong { font-size: 14px; }
    .deliv-head a { font-size: 12px; color: var(--accent); white-space: nowrap; }
    .deliv .file { color: var(--muted); font-size: 12px; margin: 2px 0 6px; }
    .deliv p { margin: 0; font-size: 13px; color: #4e5969; line-height: 1.5; }
    .dots { display: inline-flex; gap: 4px; margin-right: 8px; }
    .dots i { width: 6px; height: 6px; border-radius: 50%; background: var(--accent); animation: blink 1.2s infinite; }
    .dots i:nth-child(2) { animation-delay: .2s; }
    .dots i:nth-child(3) { animation-delay: .4s; }
    @keyframes blink { 0%,80%,100% { opacity: .25 } 40% { opacity: 1 } }
    .log-line { color: var(--muted); font-size: 13px; margin-top: 8px; max-height: 4.5em; overflow: hidden; }
    .composer-wrap { padding: 8px 24px 20px; }
    .composer {
      max-width: 760px; margin: 0 auto;
      background: var(--surface); border: 1px solid var(--line);
      border-radius: 24px; box-shadow: var(--shadow);
      padding: 10px 12px 10px 14px;
    }
    .composer.drag { border-color: var(--accent); background: #f6f9ff; }
    .pending { display: flex; flex-wrap: wrap; gap: 8px; padding: 4px 4px 8px; }
    .pending .file-card { padding: 6px 8px 6px 10px; }
    .pending button.x { border: 0; background: transparent; color: var(--muted); padding: 0 4px; }
    .composer-row { display: flex; align-items: flex-end; gap: 8px; }
    textarea {
      flex: 1; border: 0; resize: none; outline: none; background: transparent;
      min-height: 24px; max-height: 160px; padding: 8px 0; line-height: 1.5;
    }
    .icon-btn {
      width: 36px; height: 36px; border: 0; border-radius: 10px;
      background: transparent; color: var(--muted); display: grid; place-items: center;
    }
    .icon-btn:hover { background: var(--hover); color: var(--text); }
    .send {
      width: 36px; height: 36px; border: 0; border-radius: 50%;
      background: var(--accent); color: #fff; display: grid; place-items: center;
    }
    .send:disabled { background: #c9cdd4; }
    .send.stop { background: #1f2329; border-radius: 10px; }
    .send .ico-stop { display: none; }
    .send.stop .ico-go { display: none; }
    .send.stop .ico-stop { display: block; }
    .hint { text-align: center; color: #8f959e; font-size: 12px; margin-top: 8px; }
    .more { position: relative; }
    .more-menu {
      display: none; position: absolute; right: 0; top: 38px; z-index: 5;
      min-width: 168px; padding: 6px; border-radius: 12px;
      background: var(--surface); border: 1px solid var(--line); box-shadow: var(--shadow);
    }
    .more.open .more-menu { display: block; }
    .more-menu button {
      display: block; width: 100%; text-align: left; border: 0; background: transparent;
      padding: 8px 10px; border-radius: 8px; color: var(--text);
    }
    .more-menu button:hover { background: var(--hover); }
    .more-menu button:disabled { opacity: .4; cursor: not-allowed; }
    .drawer {
      width: 420px; flex-shrink: 0; background: var(--surface);
      border-left: 1px solid var(--line); display: none; flex-direction: column;
    }
    .drawer.open { display: flex; }
    .drawer header { display: flex; align-items: center; justify-content: space-between; padding: 14px 16px; border-bottom: 1px solid var(--line); }
    .drawer header select { border: 1px solid var(--line); border-radius: 8px; padding: 6px 8px; }
    .preview { flex: 1; overflow: auto; padding: 16px; white-space: pre-wrap; font-size: 13px; line-height: 1.6; color: #2b2f36; }
    #previewEdit {
      flex: 1; width: 100%; min-height: 0; max-height: none; resize: none;
      padding: 16px; font-size: 13px; line-height: 1.6; font-family: inherit;
      border: 0; border-top: 1px solid var(--line); outline: none;
      background: #fff; color: #2b2f36;
    }
    .phase-next {
      margin-top: 10px; border: 0; border-radius: 10px; cursor: pointer;
      background: linear-gradient(135deg, #5b8cff, #7c5cff); color: #fff;
      font-size: 13px; font-weight: 600; padding: 9px 16px;
    }
    .phase-next:hover { opacity: .92; }
    .modal-bg {
      position: fixed; inset: 0; background: rgba(15,23,42,.28);
      display: none; align-items: center; justify-content: center; z-index: 20;
    }
    .modal-bg.show { display: flex; }
    .modal {
      width: 400px; background: var(--surface); border-radius: 16px;
      padding: 20px; box-shadow: var(--shadow);
    }
    .modal h3 { margin: 0 0 12px; }
    .modal label { display: block; font-size: 13px; color: var(--muted); margin: 10px 0 6px; }
    .modal input { width: 100%; border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; }
    .modal .row-end { display: flex; justify-content: flex-end; gap: 8px; margin-top: 16px; }
    .primary { background: var(--accent); color: #fff; border: 0; border-radius: 10px; height: 36px; padding: 0 14px; }
    .dot { width: 6px; height: 6px; border-radius: 50%; display: inline-block; margin-right: 6px; }
    .dot.running, .dot.revising { background: var(--accent); }
    .dot.ready { background: var(--ok); }
    .dot.failed { background: var(--err); }
    .dot.cancelled { background: var(--muted); }
    .stepper { display: flex; margin-top: 12px; }
    .step { flex: 1; min-width: 0; display: flex; flex-direction: column; align-items: center; gap: 4px; position: relative; }
    .step::before {
      content: ""; position: absolute; top: 11px;
      left: calc(-50% + 13px); width: calc(100% - 26px); height: 2px;
      background: var(--line);
    }
    .step:first-child::before { display: none; }
    .step.done::before { background: var(--ok); }
    .step .nd {
      width: 24px; height: 24px; border-radius: 50%;
      border: 1.5px solid var(--line); background: var(--surface); color: var(--muted);
      display: grid; place-items: center; font-size: 11px; font-weight: 600;
      position: relative; z-index: 1;
    }
    .step .lb { font-size: 11px; color: var(--muted); white-space: nowrap; }
    .step.done .nd { background: var(--ok); border-color: var(--ok); color: #fff; }
    .step.done .lb { color: var(--text); }
    .step.act .nd { border-color: var(--accent); color: var(--accent); }
    .step.act .lb { color: var(--accent); font-weight: 600; }
    .stepper.live .step.act .nd { animation: stepPulse 1.6s infinite; }
    @keyframes stepPulse {
      0%, 100% { box-shadow: 0 0 0 3px rgba(51,112,255,.14); }
      50% { box-shadow: 0 0 0 6px rgba(51,112,255,.24); }
    }
    .step.err .nd { background: var(--err); border-color: var(--err); color: #fff; }
    .step.err .lb { color: var(--err); }
    .step.cut .nd { background: var(--warn); border-color: var(--warn); color: #fff; }
    .step.cut .lb { color: var(--warn); }
    .log-toggle { border: 0; background: transparent; color: var(--accent); font-size: 12px; padding: 4px 0 0; }
    .log-toggle:hover { text-decoration: underline; }
    .logs-full {
      margin-top: 6px; max-height: 220px; overflow: auto;
      background: #fafbfc; border: 1px solid var(--line); border-radius: 10px;
      padding: 8px 10px; font-size: 12px; color: var(--muted); line-height: 1.7;
    }
    .danger { background: var(--err); color: #fff; border: 0; border-radius: 10px; height: 36px; padding: 0 14px; }
    .toasts {
      position: fixed; top: 16px; left: 50%; transform: translateX(-50%); z-index: 40;
      display: flex; flex-direction: column; gap: 8px; align-items: center; pointer-events: none;
    }
    .review-box {
      border-top: 1px dashed var(--line); margin-top: 0; flex-shrink: 0;
      display: flex; flex-direction: column; min-height: 0; max-height: 45%;
      background: #fbfcff;
    }
    .review-head {
      padding: 10px 16px 6px; font-size: 13px; font-weight: 600; color: var(--accent);
      flex-shrink: 0;
    }
    .review-body {
      flex: 1; overflow: auto; padding: 0 16px 14px;
      font-size: 13px; line-height: 1.65; color: #2b2f36; white-space: pre-wrap;
    }
    .files .file-card { cursor: pointer; }
    .files .file-card:hover { border-color: #c9d4ff; background: var(--accent-soft); }
    /* Markdown 渲染（预览与审阅区共用） */
    .md-body { white-space: normal; font-size: 13px; line-height: 1.7; color: #2b2f36; }
    .md-body h1, .md-body h2, .md-body h3, .md-body h4, .md-body h5, .md-body h6 {
      margin: 16px 0 8px; font-weight: 640; line-height: 1.4;
    }
    .md-body h1 { font-size: 17px; }
    .md-body h2 { font-size: 15.5px; border-bottom: 1px solid var(--line); padding-bottom: 5px; }
    .md-body h3 { font-size: 14px; }
    .md-body h4, .md-body h5, .md-body h6 { font-size: 13px; }
    .md-body h1:first-child, .md-body h2:first-child, .md-body > :first-child { margin-top: 0; }
    .md-body p { margin: 8px 0; }
    .md-body table {
      border-collapse: collapse; margin: 10px 0; display: block;
      overflow-x: auto; max-width: 100%; white-space: nowrap;
    }
    .md-body th, .md-body td {
      border: 1px solid var(--line); padding: 5px 10px; font-size: 12.5px; text-align: left;
    }
    .md-body th { background: #f7f8fa; font-weight: 600; }
    .md-body pre {
      background: #f6f7f9; border: 1px solid var(--line); border-radius: 8px;
      padding: 10px 12px; overflow-x: auto; white-space: pre; margin: 10px 0;
    }
    .md-body code {
      background: #f0f2f5; border-radius: 4px; padding: 1px 5px;
      font-size: 12px; font-family: ui-monospace, Menlo, Consolas, monospace;
    }
    .md-body pre code { background: none; padding: 0; }
    .md-body blockquote {
      border-left: 3px solid #c9d4ff; margin: 8px 0; padding: 2px 12px; color: var(--muted);
    }
    .md-body ul, .md-body ol { margin: 8px 0; padding-left: 22px; }
    .md-body li { margin: 3px 0; }
    .md-body hr { border: 0; border-top: 1px solid var(--line); margin: 14px 0; }
    .md-body input[type="checkbox"] { margin-right: 5px; vertical-align: -2px; }
    .md-body a { word-break: break-all; }
    /* 抽屉：头部防挤压 + 分区拖拽 */
    .drawer { position: relative; }
    .drawer header select { flex: 1; min-width: 0; }
    .drawer-actions { display: flex; gap: 8px; flex-shrink: 0; }
    .drawer-actions .chip-btn { white-space: nowrap; }
    .vsplit {
      height: 10px; flex-shrink: 0; cursor: row-resize;
      display: flex; align-items: center; justify-content: center;
    }
    .vsplit::after {
      content: ""; width: 40px; height: 4px; border-radius: 2px; background: var(--line);
    }
    .vsplit:hover::after, .vsplit.dragging::after { background: var(--accent); }
    .hsplit { position: absolute; left: 0; top: 0; bottom: 0; width: 6px; cursor: col-resize; z-index: 3; }
    .hsplit::after {
      content: ""; position: absolute; left: 2px; top: 50%; transform: translateY(-50%);
      width: 3px; height: 40px; border-radius: 2px; background: var(--line);
    }
    .hsplit:hover::after, .hsplit.dragging::after { background: var(--accent); }
    /* 侧边栏：右缘拖宽 + 任务条目元信息 */
    .sidebar { position: relative; }
    .side-split { position: absolute; right: 0; top: 0; bottom: 0; width: 6px; cursor: col-resize; z-index: 3; }
    .side-split::after {
      content: ""; position: absolute; right: 2px; top: 50%; transform: translateY(-50%);
      width: 3px; height: 40px; border-radius: 2px; background: var(--line);
    }
    .side-split:hover::after, .side-split.dragging::after { background: var(--accent); }
    .job .sub { color: #8f959e; font-size: 11px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .job small { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    @media (max-width: 900px) { .hsplit, .side-split { display: none; } }
    .toast {
      background: #1f2329; color: #fff; font-size: 13px;
      padding: 9px 16px; border-radius: 10px; box-shadow: var(--shadow);
      animation: toastIn .18s ease-out;
    }
    .toast.err { background: var(--err); }
    @keyframes toastIn { from { opacity: 0; transform: translateY(-6px); } to { opacity: 1; transform: none; } }
    @media (max-width: 900px) {
      .sidebar { display: none; }
      .drawer { position: absolute; inset: 0; width: auto; z-index: 10; }
    }
  </style>
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="side-split" id="sideSplit" title="拖动调整宽度"></div>
    <div class="brand">
      <div class="logo">QA</div>
      <div><strong>QAgent</strong><span>测试方案助手</span></div>
    </div>
    <button class="new-chat" id="newChat">＋ 新对话</button>
    <div class="hist">
      <h4>历史任务</h4>
      <div id="jobs"></div>
    </div>
    <div class="side-foot">
      <button class="ghost" id="openSettings">设置</button>
    </div>
  </aside>
  <section class="stage">
    <div class="thread-bar" id="threadBar" hidden>
      <div>
        <div id="title">对话</div>
        <div class="meta" id="status"></div>
      </div>
      <div class="actions">
        <div class="more" id="moreBox">
          <button class="chip-btn" id="moreBtn" type="button">···</button>
          <div class="more-menu">
            <button type="button" id="runFull">重新整跑（覆盖全部）</button>
            <button type="button" id="runAuto" hidden>补齐缺失产物（保留已有）</button>
            <button type="button" id="runFromPlan" hidden>从测试方案开始重生成</button>
            <button type="button" id="runFromRisk" hidden>从风险开始重生成</button>
            <button type="button" id="runFromMatrix" hidden>从覆盖矩阵开始重生成</button>
            <button type="button" id="runCases">只重生成用例（复用矩阵）</button>
            <button type="button" id="toggleDrawer">产物预览</button>
          </div>
        </div>
      </div>
    </div>
    <div class="msgs" id="msgs"></div>
    <div class="composer-wrap">
      <div class="composer" id="composer">
        <div class="pending" id="pending"></div>
        <div class="composer-row">
          <button class="icon-btn" id="pick" title="上传文档" type="button">＋</button>
          <textarea id="chatText" rows="1" placeholder="输入修订意见，或把需求文档拖到这里"></textarea>
          <button class="send" id="send" type="button" disabled title="发送">
            <svg class="ico-go" width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M3 8h10M9 4l4 4-4 4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
            <svg class="ico-stop" width="12" height="12" viewBox="0 0 12 12"><rect x="2" y="2" width="8" height="8" rx="1.5" fill="currentColor"/></svg>
          </button>
        </div>
      </div>
      <div class="hint">支持 md / txt / pdf / docx · 已写好的测试需求/方案/风险/矩阵可直接上传，缺什么补什么</div>
    </div>
  </section>
  <aside class="drawer" id="drawer">
    <div class="hsplit" id="hsplit" title="拖动调整宽度"></div>
    <header>
      <select id="previewName"></select>
      <div class="drawer-actions">

      <div class="review-head">AI 审阅</div>

<div class="modal-bg" id="settings">
  <div class="modal">

      <button class="primary" id="dlgOk" type="button">确定</button>
    </div>

<script>
const $ = id => document.getElementById(id);
const STATUS = { uploaded: "待生成", running: "生成中", ready: "已完成", revising: "修订中", failed: "失败", cancelled: "已终止" };
let current = null, timer = null, pending = [], queuedChat = "", jobBusy = false;
let evtSource = null, lastListAt = 0;
let lastJob = null, logsExpanded = false, reviewingKey = null;
const ART_LABELS = {
  "test-requirements.md": "测试需求", "test-plan.md": "测试方案",
  "risk.md": "风险分析", "coverage-matrix.md": "覆盖矩阵",
  "testcases.md": "测试用例", "qa-review.md": "QA Review",
};
function closeEvents() { if (evtSource) { try { evtSource.close(); } catch (e) {} evtSource = null; } }
function connectEvents(id) {
  closeEvents();
  const token = localStorage.getItem("qagent_token") || "";
  const url = "/api/jobs/" + id + "/events" + (token ? "?token=" + encodeURIComponent(token) : "");
  try { evtSource = new EventSource(url); } catch (e) { timer = setTimeout(() => select(id), 600); return; }
  evtSource.onmessage = ev => {
    if (current !== id) return;
    let j; try { j = JSON.parse(ev.data); } catch (e) { return; }
    renderThread(j);
    refreshJobsThrottled();
    if (!isBusyStatus(j.status)) closeEvents();
  };
  evtSource.onerror = () => { closeEvents(); if (current === id) timer = setTimeout(() => select(id), 600); };
}
async function refreshJobsThrottled() {
  const now = Date.now();
  if (now - lastListAt < 3000) return;
  lastListAt = now;
  await refreshJobs();
}

function isBusyStatus(s) {
  return s === "running" || s === "revising";
}

function esc(s) {
  return String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]));
}
// 轻量 Markdown 渲染（先转义再生成标签，产物/审阅预览用，无外部依赖）
function inlineMd(s) {
  return s
    .replace(/`([^`]+)`/g, "<code>$1</code>")
    .replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>")
    .replace(/(^|[^*\w])\*([^*\s][^*]*?)\*/g, "$1<em>$2</em>")
    .replace(/\[([^\]]+)\]\(([^)\s]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
}
function mdToHtml(src) {
  const lines = esc(src).split("\n");
  const out = [];
  let list = null, para = [];
  const closePara = () => { if (para.length) { out.push("<p>" + inlineMd(para.join(" ")) + "</p>"); para = []; } };
  const closeList = () => { if (list) { out.push("</" + list + ">"); list = null; } };
  for (let i = 0; i < lines.length; i++) {
    const t = lines[i].trim();
    if (!t) { closePara(); closeList(); continue; }
    if (t.startsWith("```")) {
      closePara(); closeList();
      const buf = [];
      i++;
      while (i < lines.length && !lines[i].trim().startsWith("```")) { buf.push(lines[i]); i++; }
      out.push("<pre><code>" + buf.join("\n") + "</code></pre>");
      continue;
    }
    const h = /^(#{1,6})\s+(.*)$/.exec(t);
    if (h) { closePara(); closeList(); const n = h[1].length; out.push(`<h${n}>${inlineMd(h[2])}</h${n}>`); continue; }
    if (/^(-{3,}|\*{3,}|_{3,})$/.test(t)) { closePara(); closeList(); out.push("<hr>"); continue; }
    if (t.startsWith("&gt;")) { closePara(); closeList(); out.push("<blockquote>" + inlineMd(t.slice(4).trim()) + "</blockquote>"); continue; }
    if (t.includes("|") && i + 1 < lines.length && lines[i + 1].includes("-") &&
        /^\s*\|?[\s:|-]+\|?\s*$/.test(lines[i + 1])) {
      closePara(); closeList();
      const cells = row => row.replace(/^\s*\|/, "").replace(/\|\s*$/, "").split("|").map(c => c.trim());
      const head = cells(t);
      i += 2;
      const rows = [];
      while (i < lines.length && lines[i].trim() && lines[i].includes("|")) { rows.push(cells(lines[i].trim())); i++; }
      i--;
      let tbl = "<table><thead><tr>" + head.map(c => "<th>" + inlineMd(c) + "</th>").join("") + "</tr></thead><tbody>";
      for (const r of rows) tbl += "<tr>" + r.map(c => "<td>" + inlineMd(c) + "</td>").join("") + "</tr>";
      out.push(tbl + "</tbody></table>");
      continue;
    }
    const li = /^[-*+]\s+(.*)$/.exec(t);
    if (li) {
      if (list !== "ul") { closePara(); closeList(); out.push("<ul>"); list = "ul"; }
      const cb = /^\[( |x|✓)\]\s+/.exec(li[1]);
      const body = cb
        ? `<input type="checkbox" disabled${/[x✓]/i.test(cb[1]) ? " checked" : ""}> ${inlineMd(li[1].slice(cb[0].length))}`
        : inlineMd(li[1]);
      out.push("<li>" + body + "</li>");
      continue;
    }
    const oli = /^\d+[.)]\s+(.*)$/.exec(t);
    if (oli) {
      if (list !== "ol") { closePara(); closeList(); out.push("<ol>"); list = "ol"; }
      out.push("<li>" + inlineMd(oli[1]) + "</li>");
      continue;
    }
    para.push(t);
  }
  closePara(); closeList();
  return out.join("\n");
}
function headers() {
  const h = {};
  const token = localStorage.getItem("qagent_token") || "";
  if (token) h["Authorization"] = "Bearer " + token;
  return h;
}
async function api(path, opt={}, retried) {
  const res = await fetch(path, {headers: {...headers(), ...(opt.headers||{})}, ...opt});
  const ct = res.headers.get("content-type") || "";
  const data = ct.includes("json") ? await res.json().catch(() => ({})) : {};
  if (res.status === 401 && !retried) {
    const token = await uiDialog({ title: "需要访问口令", input: true, placeholder: "输入访问 Token", okText: "连接" });
    if (token) {
      localStorage.setItem("qagent_token", token);
      return api(path, opt, true);
    }
  }
  if (!res.ok) throw new Error(data.error || res.statusText);
  return data;
}
function toast(msg, type) {
  const el = document.createElement("div");
  el.className = "toast" + (type === "err" ? " err" : "");
  el.textContent = msg;
  $("toasts").appendChild(el);
  setTimeout(() => {
    el.style.transition = "opacity .25s";
    el.style.opacity = "0";
    setTimeout(() => el.remove(), 260);
  }, 3200);
}
let dlgResolve = null;
function uiDialog(opt = {}) {
  return new Promise(resolve => {
    dlgResolve = resolve;
    $("dlgTitle").textContent = opt.title || "确认";
    const msg = $("dlgMsg");
    msg.textContent = opt.message || "";
    msg.style.display = opt.message ? "" : "none";
    const inp = $("dlgInput");
    inp.hidden = !opt.input;
    inp.value = "";
    inp.placeholder = opt.placeholder || "";
    const ok = $("dlgOk");
    ok.textContent = opt.okText || "确定";
    ok.className = opt.danger ? "danger" : "primary";
    $("dlgCancel").textContent = opt.cancelText || "取消";
    $("dlg").classList.add("show");
    if (opt.input) setTimeout(() => inp.focus(), 60);
  });
}
function closeDlg(val) {
  $("dlg").classList.remove("show");
  if (dlgResolve) { const r = dlgResolve; dlgResolve = null; r(val); }
}
$("dlgOk").onclick = () => closeDlg($("dlgInput").hidden ? true : $("dlgInput").value.trim());
$("dlgCancel").onclick = () => closeDlg($("dlgInput").hidden ? false : null);
$("dlg").onclick = e => { if (e.target === $("dlg")) closeDlg($("dlgInput").hidden ? false : null); };
document.addEventListener("keydown", e => {
  if (!$("dlg").classList.contains("show")) return;
  if (e.key === "Escape") closeDlg($("dlgInput").hidden ? false : null);
  if (e.key === "Enter") { e.preventDefault(); $("dlgOk").click(); }
});
const STEPS = [
  ["需求", "test_requirements"], ["方案", "test_plan"], ["风险", "risk"],
  ["矩阵", "coverage_matrix"], ["用例", "testcases"], ["评审", "qa_review"], ["导出", "xlsx"],
];
function stepperHTML(job) {
  const arts = job.artifacts || {};
  const live = job.status === "running";
  const started = live || ["ready", "failed", "cancelled"].includes(job.status) || Object.keys(arts).length;
  if (!started) return "";
  const m = /(\d+)\s*\/\s*\d+/.exec(job.current_step || "");
  let idx = m ? Math.min(Math.max(+m[1] - 1, 1), STEPS.length) : 0;
  if (!idx) {
    let n = 1;
    STEPS.forEach((s, i) => { if (arts[s[1]]) n = Math.max(n, i + 2); });
    idx = Math.min(n, STEPS.length);
  }
  const cells = STEPS.map((s, i) => {
    const k = i + 1;
    let cls = "", mark = String(k);
    if (job.status === "ready" || arts[s[1]] || (live && k < idx)) { cls = "done"; mark = "✓"; }
    else if (live && k === idx) cls = "act";
    else if (job.status === "failed" && k === idx) { cls = "err"; mark = "×"; }
    else if (job.status === "cancelled" && k === idx) { cls = "cut"; mark = "–"; }
    return `<div class="step ${cls}"><span class="nd">${mark}</span><span class="lb">${s[0]}</span></div>`;
  }).join("");
  return `<div class="stepper${live ? " live" : ""}">${cells}</div>`;
}
function syncSend() {
  const btn = $("send");
  if (jobBusy) {
    btn.disabled = false;
    btn.classList.add("stop");
    btn.title = "停止生成";
    return;
  }
  btn.classList.remove("stop");
  btn.title = "发送";
  btn.disabled = !(pending.length || $("chatText").value.trim());
}
function renderPending() {
  $("pending").innerHTML = pending.map((f, i) =>
    `<span class="file-card"><span class="file-ico">${esc(f.name.split(".").pop().slice(0,3).toUpperCase())}</span>${esc(f.name)}<button class="x" data-i="${i}" type="button">×</button></span>`
  ).join("");
  $("pending").querySelectorAll(".x").forEach(b => b.onclick = () => { pending.splice(+b.dataset.i, 1); renderPending(); syncSend(); });
}
function addFiles(list) {
  for (const f of list) pending.push(f);
  renderPending(); syncSend();
}
function welcomeHTML() {
  return `<div class="welcome">
    <h1>你好，我是 QAgent</h1>
    <p>把 PRD 或设计文档发给我，先一起确认测试范围，再生成方案和用例。</p>
    <div class="suggest">
      <button type="button" data-act="upload">上传需求文档</button>
      <button type="button" data-act="hint" data-text="给关键路径补异常与边界用例">补异常与边界用例</button>
      <button type="button" data-act="hint" data-text="加强登录与权限相关覆盖">加强登录与权限覆盖</button>
    </div>
  </div>`;
}
function fileCards(names) {
  return `<div class="files">${names.map(n => `<button class="file-card" type="button" data-name="${esc(n)}"><span class="file-ico">${esc(String(n).split(".").pop().slice(0,3).toUpperCase())}</span>${esc(n)}</button>`).join("")}</div>`;
}
function previewTarget(name) {
  // 当前选中文件是输入文档还是生成产物
  return (lastJob && (lastJob.inputs || []).includes(name)) ? "input" : "artifact";
}
function reviewLabelOf(name) {
  return previewTarget(name) === "input" ? name : (ART_LABELS[name] || name);
}
function renderReviewBox() {
  const box = $("reviewBox"), body = $("reviewBody"), split = $("vsplit");
  const name = $("previewName").value;
  const show = (on) => { box.hidden = !on; split.hidden = !on; };
  if (!name || editingArtifact) { show(false); return; }
  const key = previewTarget(name) + ":" + name;
  const label = reviewLabelOf(name);
  const marker = "【审阅·" + label + "】";
  let msg = null;
  const chat = (lastJob && lastJob.chat) || [];
  for (let i = chat.length - 1; i >= 0; i--) {
    const c = chat[i];
    if (c.role === "assistant" && String(c.content || "").startsWith(marker)) {
      msg = String(c.content).slice(marker.length).trim();
      break;
    }
  }
  if (msg) {
    reviewingKey = null;
    body.innerHTML = `<div class="md-body">${mdToHtml(msg)}</div>`;
    show(true);
  } else if (reviewingKey === key) {
    body.innerHTML = '<span class="dots"><i></i><i></i><i></i></span>正在审阅「' + esc(label) + '」…';
    show(true);
  } else {
    show(false);
  }
}
function artCards(job) {
  const rows = job.deliverables || [];
  if (!rows.length) return "";
  return `<div class="deliverables">${rows.map(row =>
    `<div class="deliv" data-file="${esc(row.file)}" title="点击预览">
      <div class="deliv-head"><strong>${esc(row.step)}. ${esc(row.title)}</strong>
        <button class="chip-btn open-editor" type="button" data-file="${esc(row.file)}" title="用本机默认应用打开">本地打开</button></div>
      <div class="file">${esc(row.file)}</div>
      <p><b>作用</b>　${esc(row.role)}</p>
      ${row.content ? `<p><b>内容</b>　${esc(row.content)}</p>` : ""}
    </div>`
  ).join("")}</div>`;
}
async function openInEditor(name) {
  if (!current) return;
  const target = previewTarget(name) === "input" ? "input" : "artifact";
  try {
    await api(`/api/jobs/${current}/open`, {
      method: "POST",
      headers: {...headers(), "Content-Type": "application/json"},
      body: JSON.stringify({target, name})
    });
    toast("已用本机默认应用打开 " + name);
  } catch (e) {
    toast(e.message || "打开失败", "err");
  }
}
function thinkingCard(job) {
  const live = isBusyStatus(job.status);
  const failed = job.status === "failed";
  const logs = (job.logs || []).filter(line => failed || !/\bERROR:/i.test(line));
  const last = logs.slice(-1)[0] || (live ? (job.status === "revising" ? "正在回复…" : "正在阅读文档并规划测试…") : "");
  const errors = failed ? (job.error || []).filter(Boolean) : [];
  const logsBlock = logs.length > 1
    ? `<button class="log-toggle" type="button">${logsExpanded ? "收起日志" : "展开全部日志 " + logs.length + " 条 ▾"}</button>` +
      (logsExpanded ? `<div class="logs-full">${logs.map(l => `<div>${esc(l)}</div>`).join("")}</div>` : "")
    : "";
  return `<div class="status-card">
    ${live ? `<span class="dots"><i></i><i></i><i></i></span>` : ""}
    <strong>${esc(STATUS[job.status] || job.status)}</strong>
    ${job.case_count != null ? ` · ${job.case_count} 条用例` : ""}
    ${errors.length ? `<div style="color:var(--err);margin-top:6px">${esc(errors.join("; "))}</div>` : ""}
    ${stepperHTML(job)}
    ${last ? `<div class="log-line">${esc(last)}</div>` : ""}
    ${logsBlock}
    ${["ready","failed","cancelled"].includes(job.status) || Object.keys(job.artifacts || {}).length ? artCards(job) : ""}
    ${job.status === "ready" && job.stage && job.stage.done !== "export" ? `
      <div><button type="button" class="phase-next"
        data-from="${esc(job.stage.from)}" data-stop="${esc(job.stage.stop_after || "")}">
        ✓ 确认无误，${esc(job.stage.label)} →</button>
      <div class="log-line">修改产物可直接点抽屉里的「编辑」，或对话告诉我调整</div></div>` : ""}
  </div>`;
}
function pendingReplyHTML() {
  return `<div class="status-card"><span class="dots"><i></i><i></i><i></i></span><strong>正在回复…</strong></div>`;
}
function renderThread(job) {
  if (!lastJob || lastJob.id !== job.id) logsExpanded = false;
  lastJob = job;
  jobBusy = isBusyStatus(job.status);
  const canResume = !!job.can_resume_cases;
  const arts = job.artifacts || {};
  $("runFull").disabled = jobBusy;
  $("runCases").disabled = jobBusy || !canResume;
  $("runCases").title = canResume ? "复用矩阵，只重生成用例" : (jobBusy ? "正在运行" : "尚未生成覆盖矩阵");
  $("runAuto").hidden = jobBusy || !Object.keys(arts).length;
  $("runFromPlan").hidden = jobBusy || !arts.test_plan;
  $("runFromRisk").hidden = jobBusy || !arts.risk;
  $("runFromMatrix").hidden = jobBusy || !arts.coverage_matrix;
  syncSend();
  $("threadBar").hidden = false;
  $("title").textContent = job.title || "未命名任务";
  $("status").innerHTML = `<span class="dot ${esc(job.status)}"></span>${esc(STATUS[job.status] || job.status)}${job.case_count != null ? " · " + job.case_count + " 条用例" : ""}`;
  const parts = [];
  const inputs = job.inputs || [];
  parts.push(`<div class="row user"><div class="bubble">请根据这些文档生成测试方案和用例${fileCards(inputs)}</div></div>`);
  for (const m of job.chat || []) {
    const role = m.role === "user" ? "user" : "assistant";
    const av = role === "assistant" ? `<div class="avatar">QA</div>` : "";
    parts.push(`<div class="row ${role}">${av}<div class="bubble">${esc(m.content)}</div></div>`);
  }
  if (job.status !== "uploaded" || !(job.chat || []).length || Object.keys(job.artifacts || {}).length) {
    parts.push(`<div class="row assistant"><div class="avatar">QA</div>${thinkingCard(job)}</div>`);
  }
  $("msgs").innerHTML = parts.join("");
  $("msgs").scrollTop = $("msgs").scrollHeight;
  $("msgs").querySelectorAll(".phase-next").forEach(b => {
    b.onclick = () => run(b.dataset.from, b.dataset.stop || null);
  });
  $("msgs").querySelectorAll(".log-toggle").forEach(b => {
    b.onclick = () => { logsExpanded = !logsExpanded; renderThread(lastJob); };
  });
  $("msgs").querySelectorAll(".files .file-card").forEach(b => {
    b.onclick = () => {
      $("drawer").classList.add("open");
      setArtifactEditing(false);
      $("previewName").value = b.dataset.name;
      loadPreview();
    };
  });
  $("msgs").querySelectorAll(".deliv").forEach(el => {
    el.onclick = () => {
      const name = el.dataset.file;
      $("drawer").classList.add("open");
      setArtifactEditing(false);
      if (/\.(md|markdown)$/i.test(name) && [...$("previewName").options].some(o => o.value === name)) {
        $("previewName").value = name;
        loadPreview();
      } else {
        toast("非文本产物不支持预览，已可用「编辑器打开」查看");
      }
    };
  });
  $("msgs").querySelectorAll(".open-editor").forEach(b => {
    b.onclick = ev => { ev.stopPropagation(); openInEditor(b.dataset.file); };
  });
  const mds = Object.values(job.artifacts || {}).filter(f => String(f).endsWith(".md"));
  const ins = job.inputs || [];
  const grp = (label, arr) => arr.length
    ? `<optgroup label="${label}">${arr.map(v => `<option value="${esc(v)}">${esc(v)}</option>`).join("")}</optgroup>`
    : "";
  const prevSel = $("previewName").value;
  $("previewName").innerHTML = grp("输入文档", ins) + grp("生成产物", mds);
  if (prevSel && [...$("previewName").options].some(o => o.value === prevSel)) {
    $("previewName").value = prevSel;  // SSE 刷新时不丢当前选中文件
  }
  syncPreviewButtons();
  renderReviewBox();
}
function syncPreviewButtons() {
  const name = $("previewName").value;
  const isInput = !!name && previewTarget(name) === "input";
  $("editArtifact").hidden = isInput || !name;  // 输入文档不可在线编辑
  $("reviewBtn").disabled = jobBusy || !name;
  $("reviewBtn").textContent = reviewingKey ? "审阅中…" : "审阅";
}
function showWelcome() {
  clearTimeout(timer);
  closeEvents();
  current = null;
  jobBusy = false;
  $("threadBar").hidden = true;
  $("msgs").innerHTML = welcomeHTML();
  $("msgs").querySelectorAll("[data-act=upload]").forEach(b => b.onclick = () => $("files").click());
  $("msgs").querySelectorAll("[data-act=hint]").forEach(b => {
    b.onclick = () => { $("chatText").value = b.dataset.text; syncSend(); $("chatText").focus(); };
  });
  refreshJobs();
}
async function refreshJobs() {
  const data = await api("/api/jobs");
  const jobs = data.jobs || [];
  const groups = { "今天": [], "昨天": [], "更早": [] };
  for (const j of jobs) groups[dayBucket(j.created_at)].push(j);
  const sections = Object.entries(groups).filter(([, arr]) => arr.length).map(([label, arr]) =>
    `<h4>${label}</h4>` + arr.map(j => jobItemHTML(j)).join("")
  ).join("");
  $("jobs").innerHTML = sections ||
    `<h4>历史任务</h4><div style="color:var(--muted);padding:8px 12px;font-size:13px">还没有任务</div>`;
  $("jobs").querySelectorAll(".job").forEach(el => el.onclick = () => select(el.dataset.id));
  $("jobs").querySelectorAll(".del").forEach(el => el.onclick = ev => removeJob(el.dataset.id, ev));
}
function jobItemHTML(j) {
  const status = [];
  if (j.case_count != null) status.push(j.case_count + " 条用例");
  const narts = Object.keys(j.artifacts || {}).length;
  if (narts) status.push(narts + " 个产物");
  return `<div class="job ${current===j.id?"active":""}" data-id="${esc(j.id)}">
    <div class="body">
      <span class="t" title="${esc(j.title || j.id)}">${esc(j.title || j.id)}</span>
      <small><span class="dot ${esc(j.status)}"></span>${esc((STATUS[j.status] || j.status) + (status.length ? " · " + status.join(" · ") : ""))}</small>
      <span class="sub">${esc(fmtTime(j.created_at))}</span>
    </div>
    <button class="del" type="button" data-id="${esc(j.id)}" title="删除">×</button>
  </div>`;
}
function _sameDay(a, b) {
  return a.getFullYear() === b.getFullYear() && a.getMonth() === b.getMonth() && a.getDate() === b.getDate();
}
function dayBucket(iso) {
  const d = new Date(iso || "");
  if (isNaN(d)) return "更早";
  const now = new Date();
  if (_sameDay(d, now)) return "今天";
  const yest = new Date(now);
  yest.setDate(now.getDate() - 1);
  if (_sameDay(d, yest)) return "昨天";
  return "更早";
}
function fmtTime(iso) {
  const d = new Date(iso || "");
  if (isNaN(d)) return "";
  const now = new Date();
  const hm = String(d.getHours()).padStart(2, "0") + ":" + String(d.getMinutes()).padStart(2, "0");
  if (_sameDay(d, now)) return "今天 " + hm;
  const yest = new Date(now);
  yest.setDate(now.getDate() - 1);
  if (_sameDay(d, yest)) return "昨天 " + hm;
  if (d.getFullYear() === now.getFullYear()) return (d.getMonth() + 1) + "月" + d.getDate() + "日 " + hm;
  return d.getFullYear() + "年" + (d.getMonth() + 1) + "月" + d.getDate() + "日";
}
async function removeJob(id, ev) {
  ev.stopPropagation();
  const ok = await uiDialog({
    title: "删除任务",
    message: "删除后任务文件不可恢复，确定删除？",
    okText: "删除", danger: true,
  });
  if (!ok) return;
  try {
    await api("/api/jobs/"+id, {method:"DELETE"});
  } catch (e) {
    toast(e.message || "删除失败", "err");
    return;
  }
  if (current === id) {
    closeEvents();
    showWelcome();
    return;
  }
  await refreshJobs();
}
async function select(id) {
  clearTimeout(timer);
  current = id;
  const j = await api("/api/jobs/"+id);
  if (current !== id) return;
  renderThread(j);
  await refreshJobs();
  if (current !== id) return;
  if ($("drawer").classList.contains("open") && $("previewName").value) loadPreview();
  if (queuedChat && (j.status === "ready" || j.awaiting_scope)) {
    const msg = queuedChat; queuedChat = "";
    await api("/api/jobs/"+id+"/chat", {
      method:"POST",
      headers:{...headers(),"Content-Type":"application/json"},
      body: JSON.stringify({message:msg})
    }).catch(e => toast(e.message || "发送失败", "err"));
    if (current === id) return select(id);
    return;
  }
  if (isBusyStatus(j.status) && current === id) {
    connectEvents(id);
  }
}
async function loadPreview() {
  if (!current || !$("previewName").value) return;
  const name = $("previewName").value;
  const base = previewTarget(name) === "input" ? "/inputs/" : "/artifacts/";
  const res = await fetch("/api/jobs/"+current+base+encodeURIComponent(name), {headers: headers()});
  const text = await res.text();
  if (!res.ok) {
    $("preview").textContent = "加载失败: " + text;
  } else if (/\.(md|markdown)$/i.test(name)) {
    $("preview").innerHTML = `<div class="md-body">${mdToHtml(text.slice(0, 20000))}</div>`;
  } else {
    $("preview").textContent = text.slice(0, 20000);
  }
  syncPreviewButtons();
  renderReviewBox();
}
let editingArtifact = false;
function setArtifactEditing(on) {
  editingArtifact = on;
  $("preview").hidden = on;
  $("previewEdit").hidden = !on;
  $("editArtifact").textContent = on ? "取消" : "编辑";
  $("saveArtifact").hidden = !on;
  renderReviewBox();
}
$("editArtifact").onclick = async () => {
  if (!current || !$("previewName").value) return;
  if (previewTarget($("previewName").value) === "input") {
    toast("输入文档不支持在线编辑，可在对话中让我按它调整产物");
    return;
  }
  if (editingArtifact) { setArtifactEditing(false); loadPreview(); return; }
  const res = await fetch("/api/jobs/"+current+"/artifacts/"+encodeURIComponent($("previewName").value), {headers: headers()});
  $("previewEdit").value = await res.text();
  setArtifactEditing(true);
};
$("saveArtifact").onclick = async () => {
  if (!current || !$("previewName").value) return;
  try {
    await api("/api/jobs/"+current+"/artifacts/"+encodeURIComponent($("previewName").value), {
      method:"PUT",
      headers:{...headers(),"Content-Type":"application/json"},
      body: JSON.stringify({content: $("previewEdit").value})
    });
  } catch (e) { toast(e.message || "保存失败", "err"); return; }
  setArtifactEditing(false);
  loadPreview();
  select(current);  // 刷新阶段与产物状态
};
async function createAndRun() {
  if (!pending.length) return;
  const fd = new FormData();
  for (const f of pending) fd.append("files", f);
  pending = []; renderPending(); syncSend();
  const res = await fetch("/api/jobs", {method:"POST", headers: headers(), body: fd});
  const data = await res.json();
  if (!res.ok) { toast(data.error || "创建失败", "err"); return; }
  await select(data.id);
  if (!data.awaiting_scope) {
    // 分段工作流：从 auto 起点缺什么补什么（已上传的测试需求/方案等直接复用）
    const arts = data.artifacts || {};
    let stop = "test_requirements";
    if (arts.test_requirements) stop = "coverage_matrix";
    if (arts.coverage_matrix) stop = null;
    await api("/api/jobs/"+data.id+"/run", {
      method:"POST",
      headers:{...headers(),"Content-Type":"application/json"},
      body: JSON.stringify({from:"auto", stop_after: stop})
    }).catch(() => {});
    await select(data.id);
  }
}
async function send() {
  const text = $("chatText").value.trim();
  if (pending.length) {
    $("chatText").value = "";
    if (text) queuedChat = text;
    await createAndRun();
    return;
  }
  if (!text) return;
  if (!current) {
    $("chatText").value = "";
    $("chatText").placeholder = "请先上传需求文档，或点左上角「新对话」后拖入文件";
    $("files").click();
    return;
  }
  if (jobBusy) return;
  $("moreBox").classList.remove("open");
  $("chatText").value = "";
  $("chatText").style.height = "auto";
  jobBusy = true;
  syncSend();
  const id = current;
  $("msgs").insertAdjacentHTML("beforeend",
    `<div class="row user"><div class="bubble">${esc(text)}</div></div>` +
    `<div class="row assistant"><div class="avatar">QA</div>${pendingReplyHTML()}</div>`);
  $("msgs").scrollTop = $("msgs").scrollHeight;
  try {
    await api("/api/jobs/"+id+"/chat", {
      method:"POST",
      headers:{...headers(),"Content-Type":"application/json"},
      body: JSON.stringify({message:text})
    });
  } catch (e) {
    jobBusy = false;
    toast(e.message || "发送失败", "err");
  }
  if (current === id) select(id);
}
async function run(from, stop) {
  if (!current) return;
  await api("/api/jobs/"+current+"/run", {
    method:"POST",
    headers:{...headers(),"Content-Type":"application/json"},
    body: JSON.stringify({from, stop_after: stop || undefined})
  });
  select(current);
}

$("newChat").onclick = showWelcome;
$("pick").onclick = () => $("files").click();
$("files").onchange = () => { addFiles($("files").files); $("files").value = ""; };
$("chatText").oninput = () => {
  $("chatText").style.height = "auto";
  $("chatText").style.height = Math.min($("chatText").scrollHeight, 160) + "px";
  syncSend();
};
$("chatText").onkeydown = e => {
  if (e.key === "Enter" && !e.shiftKey) {
    e.preventDefault();
    if (!jobBusy && !$("send").disabled) send();
  }
};
$("send").onclick = () => jobBusy ? cancelCurrent() : send();
$("moreBtn").onclick = ev => {
  ev.stopPropagation();
  $("moreBox").classList.toggle("open");
};
document.addEventListener("click", () => $("moreBox").classList.remove("open"));
$("runFull").onclick = async () => {
  $("moreBox").classList.remove("open");
  if (!current) return;
  const ok = await uiDialog({
    title: "重新整跑",
    message: "将按需求重新生成，已有方案和用例会被覆盖。",
    okText: "重新生成", danger: true,

$("runAuto").onclick = () => {

  run("auto");
};

  $("moreBox").classList.remove("open");
  if (!current) return;
  const ok = await uiDialog({
    title: "从" + label + "重生成",

    okText: "开始重生成", danger: true,

$("runFromRisk").onclick = () => _confirmRegenFrom("风险", "risk");
$("runFromMatrix").onclick = () => _confirmRegenFrom("覆盖矩阵", "coverage_matrix");
$("runCases").onclick = () => {
  $("moreBox").classList.remove("open");
  if ($("runCases").disabled) return;
  run("testcases");
};
async function cancelCurrent() {
  if (!current) return;
  try {
    await api("/api/jobs/"+current+"/cancel", {method:"POST"});
  } catch (e) {
    toast(e.message || "终止失败", "err");
  }
  select(current);
}
$("toggleDrawer").onclick = () => {
  $("moreBox").classList.remove("open");
  $("drawer").classList.toggle("open");
  loadPreview();
};
$("closeDrawer").onclick = () => { $("drawer").classList.remove("open"); setArtifactEditing(false); };
$("previewName").onchange = () => { setArtifactEditing(false); syncPreviewButtons(); loadPreview(); };
$("reviewBtn").onclick = async () => {
  if (!current || !$("previewName").value || jobBusy) return;
  const name = $("previewName").value;
  const target = previewTarget(name);
  reviewingKey = target + ":" + name;
  syncPreviewButtons();
  renderReviewBox();
  try {
    await api("/api/jobs/"+current+"/review", {
      method: "POST",
      headers: {...headers(), "Content-Type": "application/json"},
      body: JSON.stringify({target, name})
    });
  } catch (e) {
    reviewingKey = null;
    syncPreviewButtons();
    renderReviewBox();
    toast(e.message || "审阅失败", "err");
    return;
  }
  select(current);  // 状态已变 revising：重连 SSE 等审阅结果
};
async function loadLlmSettings() {
  $("apiKey").value = "";
  try {
    const s = await api("/api/settings");
    $("apiKey").placeholder = s.api_key_configured
      ? "已配置 " + (s.api_key_hint || "") + "，留空则不改"
      : "未配置，在此填写";
    $("baseUrl").value = s.base_url || "";
    $("model").value = s.model || "";
  } catch (e) {
    $("apiKey").placeholder = e.message || "无法读取当前配置";
  }
}
$("openSettings").onclick = () => { $("settings").classList.add("show"); loadLlmSettings(); };
$("closeSettings").onclick = () => $("settings").classList.remove("show");
$("saveSettings").onclick = async () => {
  const body = { model: $("model").value.trim(), base_url: $("baseUrl").value.trim() };
  if ($("apiKey").value.trim()) body.api_key = $("apiKey").value.trim();
  try {
    if (body.api_key || body.model || body.base_url) {
      await api("/api/settings", {
        method: "POST",
        headers: {...headers(), "Content-Type": "application/json"},
        body: JSON.stringify(body)
      });
    }
    $("settings").classList.remove("show");
  } catch (e) {
    toast(e.message || "保存失败", "err");
  }
};

const box = $("composer");
["dragenter","dragover"].forEach(name => box.addEventListener(name, e => { e.preventDefault(); box.classList.add("drag"); }));
box.addEventListener("dragleave", e => { e.preventDefault(); box.classList.remove("drag"); });
box.addEventListener("drop", e => {
  e.preventDefault(); box.classList.remove("drag");
  addFiles(e.dataTransfer.files);
});

// 抽屉分区拖拽：左缘调宽度、审阅区上方调高度（localStorage 记忆）
function dragify(handle, onMove) {
  handle.addEventListener("pointerdown", e => {
    e.preventDefault();
    handle.classList.add("dragging");
    const move = ev => onMove(ev);
    const stop = () => {
      handle.classList.remove("dragging");
      window.removeEventListener("pointermove", move);
      window.removeEventListener("pointerup", stop);
      window.removeEventListener("pointercancel", stop);
    };
    // 监听 window：指针移出把手后仍能跟踪，也不依赖 setPointerCapture
    window.addEventListener("pointermove", move);
    window.addEventListener("pointerup", stop);
    window.addEventListener("pointercancel", stop);
  });
}
(function setupDrawerSplits() {
  const drawer = $("drawer"), reviewBox = $("reviewBox"), sidebar = $("sidebar") || document.querySelector(".sidebar");
  let saveT = 0;
  const save = (k, v) => {
    clearTimeout(saveT);
    saveT = setTimeout(() => { try { localStorage.setItem(k, String(v)); } catch (e) {} }, 300);
  };
  const savedW = +localStorage.getItem("qagent_drawer_w") || 0;
  if (savedW >= 320) drawer.style.width = Math.min(savedW, 720) + "px";
  const savedH = +localStorage.getItem("qagent_review_h") || 0;
  if (savedH >= 80) { reviewBox.style.height = savedH + "px"; reviewBox.style.maxHeight = "none"; }
  const savedSide = +localStorage.getItem("qagent_sidebar_w") || 0;
  if (savedSide >= 220) sidebar.style.width = Math.min(savedSide, 460) + "px";
  dragify($("hsplit"), ev => {
    const rect = drawer.getBoundingClientRect();
    const w = Math.max(320, Math.min(rect.right - ev.clientX, 720));
    drawer.style.width = w + "px";
    save("qagent_drawer_w", Math.round(w));
  });
  dragify($("vsplit"), ev => {
    const rect = drawer.getBoundingClientRect();
    const h = Math.max(80, Math.min(rect.bottom - ev.clientY, rect.height - 150));
    reviewBox.style.height = h + "px";
    reviewBox.style.maxHeight = "none";
    save("qagent_review_h", Math.round(h));
  });
  dragify($("sideSplit"), ev => {
    const rect = sidebar.getBoundingClientRect();
    const w = Math.max(220, Math.min(ev.clientX - rect.left, 460));
    sidebar.style.width = w + "px";
    save("qagent_sidebar_w", Math.round(w));
  });
})();

showWelcome();
